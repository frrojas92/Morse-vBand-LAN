<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instructor · Morse vBand LAN</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/instructor.css"><link rel="stylesheet" href="/features.css"><script src="/theme.js" defer></script></head><body><main>
<header class="site-header"><h1>Instructor</h1><div class="header-actions"><button class="theme-toggle" type="button" aria-label="Cambiar tema">Modo claro</button><img class="institution-logo" src="/escuela-telecomunicaciones-logo.png" alt="Escuela de Telecomunicaciones del Ejército de Chile"></div></header>
<section class="panel" id="loginPanel"><form id="loginForm"><fieldset><legend>Acceso del instructor</legend><label>Indicativo<input id="instructorCallsign" maxlength="16" value="INSTRUCTOR" required autocomplete="off"></label><label>PIN<input id="pin" type="password" required autocomplete="current-password"></label><button>Ingresar</button></fieldset></form></section><div id="status">Sin autenticar</div>
<section id="desk" hidden><section class="panel create"><form id="createForm"><label>Nuevo canal<input id="newChannel" maxlength="24" placeholder="CLASE-A" required></label><button>Crear</button></form><h2>Canales</h2><ul id="roomDirectory"><li class="muted">No hay canales</li></ul></section><section class="panel instructor-tx"><h2>Transmisor del instructor</h2><p>Canal: <strong id="txChannel">Ninguno</strong> · <span id="txState">Seleccione “Transmitir aquí” en un canal.</span></p><div class="tx-controls"><label>Modo<select id="txMode"><option value="iambic-a">Iámbico A</option><option value="iambic-b" selected>Iámbico B</option><option value="straight">Llave vertical</option></select></label><span>Velocidad: <strong id="txWpm">15</strong> PPM</span><div class="paddles"><span id="txDitLamp" class="paddle">DIT · Ctrl izquierdo</span><span id="txDahLamp" class="paddle">DAH · Ctrl derecho</span></div></div></section><div id="rooms"></div></section>
<footer><a href="/">Vista del estudiante</a></footer>
</main><script src="/socket.io/socket.io.js"></script><script type="module" src="/instructor.js"></script></body></html>
